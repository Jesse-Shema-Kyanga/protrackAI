<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTrackAI Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
        }

        .mtn-yellow {
            background-color: #ffcc00;
        }

        .mtn-text-yellow {
            color: #ffcc00;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-gray-800 p-8 rounded-lg shadow-2xl border-2 border-yellow-500">
        <div class="text-center mb-8">
            <img src="https://logonoid.com/images/mtn-logo.jpg" alt="MTN"
                class="w-20 h-20 mx-auto rounded-full bg-white p-2">
            <h2 class="text-3xl font-bold mtn-text-yellow mt-4">Create Account</h2>
        </div>

        <form id="signupForm" class="space-y-6">
            <input type="text" id="name" required placeholder="Full Name"
                class="w-full px-4 py-3 bg-gray-700 text-white rounded-md focus:ring-2 focus:ring-yellow-500">
            <input type="text" id="userId" required placeholder="Employee ID"
                class="w-full px-4 py-3 bg-gray-700 text-white rounded-md focus:ring-2 focus:ring-yellow-500">
            <input type="email" id="email" required placeholder="Work Email"
                class="w-full px-4 py-3 bg-gray-700 text-white rounded-md focus:ring-2 focus:ring-yellow-500">
            <input type="password" id="password" required placeholder="Password"
                class="w-full px-4 py-3 bg-gray-700 text-white rounded-md focus:ring-2 focus:ring-yellow-500">
            <input type="password" id="confirm" required placeholder="Confirm Password"
                class="w-full px-4 py-3 bg-gray-700 text-white rounded-md focus:ring-2 focus:ring-yellow-500">

            <select id="role" required
                class="w-full px-4 py-3 bg-gray-700 text-white rounded-md focus:ring-2 focus:ring-yellow-500">
                <option value="">Select Role</option>
                <option value="employee">Employee</option>
                <option value="supervisor">Supervisor</option>
                <option value="hr">HR</option>
            </select>

            <button type="submit"
                class="w-full mtn-yellow text-black font-bold py-3 rounded-md hover:bg-yellow-600 transition shadow-lg">
                Create Account
            </button>
        </form>

        <div id="msg" class="mt-4 text-center text-sm hidden"></div>

        <p class="mt-6 text-center text-gray-400">
            Have an account? <a href="login.html" class="text-yellow-500 hover:text-yellow-400">Login</a>
        </p>
    </div>

    <script src="src/config.js"></script>
    <script>
        document.getElementById('signupForm').onsubmit = async e => {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            if (pwd !== confirm) return showMsg('Passwords do not match', 'error');

            const payload = {
                id: document.getElementById('userId').value.trim(),
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: pwd,
                role: document.getElementById('role').value
            };

            try {
                const res = await fetch(`${API_BASE}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    showMsg('Account created! Redirecting to login...', 'success');
                    setTimeout(() => location.href = 'login.html', 1500);
                } else {
                    showMsg(data.error || 'Signup failed', 'error');
                }
            } catch (err) {
                showMsg('Server error', 'error');
            }
        };

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = `mt-4 text-center text-sm ${type === 'error' ? 'text-red-400' : 'text-green-400'}`;
            msg.classList.remove('hidden');
        }
    </script>
</body>

</html>
