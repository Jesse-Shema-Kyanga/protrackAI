<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTrackAI Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
        }

        .mtn-yellow-bg {
            background-color: #ffcc00;
        }

        .mtn-text-yellow {
            color: #ffcc00;
        }

        .icon-placeholder {
            width: 24px;
            height: 24px;
            background-color: #000;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
        }

        #successModal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-black text-white p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center">
            <img src="https://logonoid.com/images/mtn-logo.jpg" alt="MTN" class="w-10 h-10 object-contain mr-2">
            <h1 class="text-2xl font-bold mtn-text-yellow drop-shadow">ProTrackAI</h1>
            <nav id="main-nav" class="hidden md:flex space-x-6 text-lg ml-6"></nav>
        </div>
        <div class="flex items-center space-x-4">
            <div class="icon-placeholder bg-gray-700 rounded-full p-1"><svg xmlns="http://www.w3.org/2000/svg"
                    fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg></div>
            <div class="icon-placeholder bg-gray-700 rounded-full p-1 relative">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9.071a5.956 5.956 0 00-4.04-5.626 5.4 5.4 0 00-4.082 1.096 6.062 6.062 0 00-2.523 1.838 9.75 9.75 0 00-.834 4.195zM12 21a2 2 0 01-2-2h4a2 2 0 01-2 2z" />
                </svg>
                <span id="alertBadge"
                    class="absolute top-0 right-0 px-2 py-1 text-xs font-bold text-black bg-yellow-500 rounded-full">0</span>
            </div>
            <div class="relative group cursor-pointer">
                <div class="flex items-center space-x-2">
                    <div id="userInitials"
                        class="w-10 h-10 bg-yellow-500 rounded-full flex items-center justify-center text-black font-bold text-lg">
                    </div>
                    <span id="userName" class="text-white hidden md:block"></span>
                </div>
                <div
                    class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 hidden group-hover:block z-10">
                    <a href="profile.html"
                        class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 font-semibold mtn-text-yellow">My
                        Profile</a>
                    <a href="login.html" id="logoutBtn"
                        class="block px-4 py-2 text-sm text-red-600 hover:bg-red-100">Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow p-6 bg-gray-100">
        <h2 class="text-2xl font-semibold text-black mb-6">My Profile & Settings</h2>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-md text-center border-b-4 border-mtn-yellow">
                <div class="w-32 h-32 bg-gray-200 border-4 border-dashed rounded-full mx-auto mb-4" id="avatarPreview">
                </div>
                <input type="file" id="avatarInput" accept="image/*" class="hidden">
                <button onclick="document.getElementById('avatarInput').click()"
                    class="text-sm text-gray-600 underline mb-4">Change Photo</button>
                <h3 id="displayName" class="text-2xl font-bold"></h3>
                <p id="displayRole" class="text-gray-600"></p>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md border-b-4 border-black">
                <h3 class="text-xl font-semibold mb-4">Profile Information</h3>
                <form id="profileForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Full Name</label>
                            <input type="text" id="name" required
                                class="mt-1 block w-full px-4 py-2 border rounded-md focus:ring-yellow-500 focus:border-yellow-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Employee ID</label>
                            <input type="text" id="id" disabled
                                class="mt-1 block w-full px-4 py-2 border rounded-md bg-gray-100">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" id="email" required
                                class="mt-1 block w-full px-4 py-2 border rounded-md focus:ring-yellow-500 focus:border-yellow-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Department</label>
                            <input type="text" id="dept"
                                class="mt-1 block w-full px-4 py-2 border rounded-md bg-gray-100" disabled>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Position</label>
                            <input type="text" id="pos"
                                class="mt-1 block w-full px-4 py-2 border rounded-md bg-gray-100" disabled>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Team</label>
                            <input type="text" id="team"
                                class="mt-1 block w-full px-4 py-2 border rounded-md bg-gray-100" disabled>
                        </div>
                    </div>
                    <button type="submit"
                        class="mtn-yellow-bg text-black font-bold py-2 px-6 rounded hover:bg-yellow-600 shadow-md">Save
                        Changes</button>
                </form>

                <hr class="my-8 border-gray-300">

                <h3 class="text-xl font-semibold mb-4">Change Password</h3>
                <form id="passwordForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Current Password</label>
                            <input type="password" id="currentPass" required
                                class="mt-1 block w-full px-4 py-2 border rounded-md focus:ring-yellow-500 focus:border-yellow-500">
                        </div>
                        <div></div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">New Password</label>
                            <input type="password" id="newPass" required
                                class="mt-1 block w-full px-4 py-2 border rounded-md focus:ring-yellow-500 focus:border-yellow-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Confirm New Password</label>
                            <input type="password" id="confirmPass" required
                                class="mt-1 block w-full px-4 py-2 border rounded-md focus:ring-yellow-500 focus:border-yellow-500">
                        </div>
                    </div>
                    <button type="submit"
                        class="mtn-yellow-bg text-black font-bold py-2 px-6 rounded hover:bg-yellow-600 shadow-md">Update
                        Password</button>
                </form>
            </div>
        </div>
    </main>

    <div id="successModal">
        <div class="modal-content">
            <h3 class="text-xl font-semibold mb-4 text-green-600">✓ Success!</h3>
            <p id="modalMessage" class="mb-4"></p>
            <button onclick="closeModal()" class="mtn-yellow-bg text-black py-2 px-4 rounded">OK</button>
        </div>
    </div>

    <footer class="bg-black text-white text-center p-4 text-sm mt-8">
        ProTrackAI © 2025 | Powered by Intelligent Analytics
    </footer>

    <script src="src/config.js"></script>
    <script>
        const currentUser = Auth.getUser() || {};
        const userId = currentUser.id;

        const navMap = {
            employee: ['employee-dashboard.html|My Dashboard', 'tasks.html|My Tasks', 'employee-feedback.html|Feedback', 'profile.html|My Profile'],
            supervisor: ['index.html|Dashboard', 'tasks.html|Tasks', 'time.html|Time & Attendance', 'goals.html|Goals', 'supervisor-feedback.html|Feedback', 'profile.html|Profile', 'activity-analytics.html|Activity Analytics'],
            hr: ['hr-dashboard.html|HR Dashboard', 'hr-workforce-analytics.html|Workforce Analytics', 'hr-evaluations.html|Evaluations', 'profile.html|Profile']
        };

        const nav = document.getElementById('main-nav');
        const links = navMap[currentUser.role] || navMap.employee;
        nav.innerHTML = links.map(l => {
            const [href, text] = l.split('|');
            const active = location.href.includes(href) ? 'mtn-text-yellow font-semibold' : '';
            return `<a href="${href}" class="hover:text-yellow-500 transition ${active}">${text}</a>`;
        }).join('');

        document.getElementById('userInitials').textContent = (currentUser.name || '??').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        document.getElementById('userName').textContent = `${currentUser.name || 'User'} (${currentUser.role || 'Unknown'})`;

        function showSuccess(message) {
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('successModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }

        async function loadProfile() {
            if (!userId) {
                showSuccess('No user logged in');
                return;
            }
            try {
                const res = await apiFetch(`${API_BASE}/users/${userId}`);
                const user = await res.json();
                document.getElementById('name').value = user.name || '';
                document.getElementById('id').value = user.id || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('dept').value = user.dept || '';
                document.getElementById('pos').value = user.pos || '';
                document.getElementById('team').value = user.team || '';
                document.getElementById('displayName').textContent = user.name;
                document.getElementById('displayRole').textContent = `${user.role} • ${user.dept || ''} ${user.pos || ''}`.trim();
            } catch (e) {
                console.error(e);
                showSuccess('Error loading profile');
            }
        }

        document.getElementById('profileForm').onsubmit = async e => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            };
            try {
                await apiFetch(`${API_BASE}/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                showSuccess('Profile updated successfully!');
                currentUser.name = payload.name;
                currentUser.email = payload.email;
                Auth.setUser(currentUser);
                loadProfile();
            } catch (e) {
                showSuccess('Profile update failed');
            }
        };

        document.getElementById('passwordForm').onsubmit = async e => {
            e.preventDefault();
            const current = document.getElementById('currentPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirm = document.getElementById('confirmPass').value;

            if (newPass !== confirm) {
                showSuccess('Passwords do not match');
                return;
            }

            try {
                await apiFetch(`${API_BASE}/users/${userId}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword: current, newPassword: newPass })
                });
                showSuccess('Password changed successfully!');
                e.target.reset();
            } catch (e) {
                showSuccess('Password change failed');
            }
        };

        document.getElementById('logoutBtn').onclick = e => {
            e.preventDefault();
            Auth.logout();
        };

        loadProfile();
    </script>
</body>

</html>
